# Vitis HLS configuration for Crypto3DStackCPU
# Target board : Xilinx/AMD AC701 Artix-7 Evaluation Kit (EK-A7-AC701-G)
# Target device: xc7a200tfbg676-2
# Board ref    : https://www.amd.com/en/products/adaptive-socs-and-fpgas/evaluation-boards/ek-a7-ac701-g.html

part=xc7a200tfbg676-2
board=xilinx.com:ac701:part0:1.4

[hls]
flow_target=vivado
package.output.format=ip_catalog
package.output.syn=false
syn.top=Crypto3DStackCPU_top

# Synthesis source: single translation unit containing the full CPU,
# AES datapath, secure header, and 4-layer stacked-memory abstraction.
syn.file=../src/3d.cpp

# C simulation testbench: reuses the desktop contract-driven harness.
tb.file=../src/3d_test.cpp

# Extra include path so header.h is found from both synthesis and CSIM.
syn.cflags=-std=c++14 -I../src -Wno-unknown-pragmas
tb.cflags=-std=c++17 -I../src -Wno-unknown-pragmas

# 100 MHz target CPU clock (10 ns period). AC701 supplies a 200 MHz LVDS
# reference on SYSCLK_P/N; the Clocking Wizard divides it to 100 MHz for
# Crypto3DStackCPU_top. Matches the XDC template in hardware_3d/constraints.
clock=10ns
clock_uncertainty=0.8ns

# Default CSIM argument: run the sealed demo image produced by the
# encryptor (see run_pipeline.ps1). Generate `demo.hex` before CSIM.
csim.argv=../demo.hex ../programs/demo.contract
